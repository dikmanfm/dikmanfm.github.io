<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <!-- אבטחה: הדף מדבר רק עם שרת הניהול (Worker). הסיסמה והמפתחות לא נמצאים כאן בכלל. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://*.r2.dev https://i.ytimg.com; media-src 'self' blob: https://*.r2.dev; font-src 'self'; connect-src https://dikmanfm-admin.dikmanfm.workers.dev http://localhost:8787; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#070707">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ניהול · DIKMAN FM</title>
  <link rel="icon" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body>
  <header class="bar">
    <button class="bar-back" id="back" type="button" hidden aria-label="חזרה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="bar-title"><span class="logo" dir="ltr">DIKMAN<b>FM</b></span><h1 id="title">ניהול</h1></div>
    <button class="bar-out" id="logout" type="button" hidden>יציאה</button>
  </header>

  <main id="app" tabindex="-1">
    <!-- כניסה -->
    <section id="login" class="screen" hidden>
      <form id="loginForm" class="card login" novalidate>
        <h2>כניסה לניהול האתר</h2>
        <p class="muted">הדף הזה לניהול התוכן של DIKMAN FM בלבד.</p>
        <input type="text" name="username" value="admin" autocomplete="username" hidden>
        <label class="field"><span>סיסמה</span>
          <input id="password" type="password" autocomplete="current-password" enterkeyhint="go" required>
        </label>
        <button class="btn primary big" type="submit">כניסה</button>
        <p class="msg" id="loginMsg" role="alert"></p>
      </form>
    </section>

    <!-- מסך ראשי -->
    <section id="home" class="screen" hidden>
      <p class="muted lead">מה מעדכנים היום?</p>
      <nav class="tiles" id="tiles" aria-label="אזורי האתר"></nav>
    </section>

    <!-- אזור -->
    <section id="area" class="screen" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js?v=1"></script>
  <script src="admin.js?v=1"></script>
</body>
</html>
