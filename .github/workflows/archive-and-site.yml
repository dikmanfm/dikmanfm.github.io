# ארכיון טלגרם + פרסום האתר – רץ על השרתים של GitHub, בלי שרת משלכם.
#  • כל שעה: מושך פרקים חדשים משני ערוצי הטלגרם, מעלה ל-R2 ומעדכן את data/episodes.json
#  • אחרי כל משיכה, ובכל שינוי בקבצים: מפרסם את האתר ב-GitHub Pages
name: ארכיון ואתר

on:
  schedule:
    - cron: "17 * * * *"      # כל שעה (בדקה 17)
  workflow_dispatch:          # כפתור "Run workflow" להרצה ידנית
  push:
    branches: [main]

# הרשאות מינימליות: כברירת מחדל קריאה בלבד, וכל משימה מקבלת רק את מה שהיא צריכה
permissions:
  contents: read

jobs:
  sync:
    # רץ רק אחרי שהוגדר MEDIA_BASE_URL (שלב 4 ב-README) – עד אז האתר מתפרסם בלי סנכרון, בלי ריצות שנכשלות כל שעה
    if: github.event_name != 'push' && vars.MEDIA_BASE_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write          # שמירת data/episodes.json בלבד
    timeout-minutes: 350
    concurrency:
      group: telegram-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: התקנה
        run: pip install -r sync/requirements.txt

      - name: משיכת פרקים מטלגרם
        timeout-minutes: 335
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          CHANNELS: ${{ vars.CHANNELS }}
          AUDIO_BITRATE: ${{ vars.AUDIO_BITRATE }}
        run: python sync/telegram_archive.py

      - name: שמירת רשימת הארכיון
        if: always()
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add data/episodes.json data/sync-state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "אין פרקים חדשים"; exit 0; fi
          git commit -m "ארכיון: עדכון פרקים"
          git pull --rebase --autostash
          git push

  deploy:
    needs: sync
    if: always() && needs.sync.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5.0.0
      # מפרסמים רק את קבצי האתר – בלי סקריפט הסנכרון, README, מצב הסנכרון וקבצי git
      - name: הכנת קבצי האתר
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js fonts icons vendor concepts _site/
          mkdir _site/data && cp data/episodes.json data/stories.json data/manual-episodes.json _site/data/
          if [ -d admin ]; then cp -r admin _site/; fi
          if [ -d data/stories ]; then cp -r data/stories _site/data/; fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
